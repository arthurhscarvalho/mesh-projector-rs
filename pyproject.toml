[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "mesh_projector"
version = "1.0.0"
description = "Generate orthographic projections from a mesh."
readme = "README.md"
requires-python = "==3.12.9"
dependencies = ["numpy>=2.2", "open3d==0.19.0", "toml>=0.10.2", "loguru>=0.7"]
classifier = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python",
    "Programming Language :: Rust",
]

[project.urls]
repository = "https://github.com/arthurhscarvalho/mesh-projector"
