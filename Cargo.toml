[workspace]
members = [
    "crates/core",
    "crates/cpu",
    "crates/wgpu",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "1.0.0"

[workspace.dependencies]
mesh-projector-core = { path = "crates/core" }
mesh-projector-cpu = { path = "crates/cpu" }
ndarray = "0.16.1"
num = "0.4.3"
log = "0.4.27"
colog = "1.3.0"
rayon = "1.10.0"
tobj = "4.0.0"
image = "0.24.7"
once_cell = "1.21.3"
bytemuck = { version = "1.22.0", features = ["derive"] }
pollster = "0.4.0"
wgpu = "29.0.1"
